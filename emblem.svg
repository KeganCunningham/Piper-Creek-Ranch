  <!-- Sun -->
  <circle cx="100" cy="88" r="12" fill="none" stroke="#b8912a" stroke-width="1.2"/>
  <circle cx="100" cy="88" r="3" fill="#b8912a"/>

  <!-- Sun rays -->
  <line x1="100" y1="72" x2="100" y2="64" stroke="#b8912a" stroke-width="1.1"/>
  <line x1="100" y1="104" x2="100" y2="112" stroke="#b8912a" stroke-width="1.1"/>
  <line x1="84" y1="88" x2="76" y2="88" stroke="#b8912a" stroke-width="1.1"/>
  <line x1="116" y1="88" x2="124" y2="88" stroke="#b8912a" stroke-width="1.1"/>
  <line x1="88.7" y1="76.7" x2="83" y2="71" stroke="#b8912a" stroke-width="1"/>
  <line x1="111.3" y1="76.7" x2="117" y2="71" stroke="#b8912a" stroke-width="1"/>
  <line x1="88.7" y1="99.3" x2="83" y2="105" stroke="#b8912a" stroke-width="1"/>
  <line x1="111.3" y1="99.3" x2="117" y2="105" stroke="#b8912a" stroke-width="1"/>

  <!-- Mountains craggy -->
  <polygon points="24,134 46,86 62,108 80,62 100,90 120,54 140,94 160,72 176,134"
