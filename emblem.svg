  <path d="M100 18 L162 42 L180 100 L162 150 L100 180 L38 150 L20 100 L38 42 Z"
    stroke="#b8912a" stroke-width="0.5" fill="#0c0a08" opacity="0.8"/>

  <!-- Horizon ground -->
  <line x1="24" y1="134" x2="176" y2="134" stroke="#b8912a" stroke-width="1.5"/>

  <!-- Fence -->
  <line x1="36" y1="134" x2="36" y2="148" stroke="#b8912a" stroke-width="1.3"/>
  <line x1="58" y1="134" x2="58" y2="148" stroke="#b8912a" stroke-width="1.3"/>
  <line x1="80" y1="134" x2="80" y2="148" stroke="#b8912a" stroke-width="1.3"/>
  <line x1="102" y1="134" x2="102" y2="148" stroke="#b8912a" stroke-width="1.3"/>
  <line x1="124" y1="134" x2="124" y2="148" stroke="#b8912a" stroke-width="1.3"/>
  <line x1="146" y1="134" x2="146" y2="148" stroke="#b8912a" stroke-width="1.3"/>
  <line x1="24" y1="143" x2="176" y2="143" stroke="#b8912a" stroke-width="0.7" opacity="0.4"/>

  <!-- Rolling hills background (distant) -->
  <path d="M24,134 Q50,110 70,118 Q90,124 100,108 Q110,92 130,106 Q150,118 176,114 L176,134 Z"
