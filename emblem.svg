<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Octagon Crest -->
  <polygon points="100,8 158,30 184,88 184,150 158,184 100,198 42,184 16,150 16,88 42,30"
    fill="#1a1612" stroke="#b8912a" stroke-width="4"/>
  <polygon points="100,20 148,38 172,90 172,146 148,176 100,188 52,176 28,146 28,90 52,38"
    fill="none" stroke="#b8912a" stroke-width="1" opacity="0.4"/>

  <!-- Sun rays -->
  <circle cx="100" cy="72" r="16" fill="#d4ae52" opacity="0.9"/>
  <g stroke="#d4ae52" stroke-width="1.5" opacity="0.5">
    <line x1="100" y1="48" x2="100" y2="42"/>
    <line x1="118" y1="54" x2="122" y2="49"/>
    <line x1="128" y1="72" x2="134" y2="72"/>
    <line x1="118" y1="90" x2="122" y2="95"/>
    <line x1="82" y1="90" x2="78" y2="95"/>
    <line x1="72" y1="72" x2="66" y2="72"/>
    <line x1="82" y1="54" x2="78" y2="49"/>
  </g>

  <!-- Mountains -->
  <polygon points="50,120 80,78 110,120" fill="#7a8c6e" opacity="0.8"/>
  <polygon points="90,120 120,82 150,120" fill="#5a6c4e" opacity="0.8"/>

  <!-- Horizon line -->
  <line x1="36" y1="120" x2="164" y2="120" stroke="#b8912a" stroke-width="1.5"/>

  <!-- Rolling hills / pasture -->
  <ellipse cx="100" cy="132" rx="62" ry="12" fill="#7a8c6e" opacity="0.3"/>

  <!-- Fence posts -->
  <g stroke="#b8912a" stroke-width="1.5" opacity="0.7">
    <line x1="56" y1="136" x2="56" y2="152"/>
    <line x1="76" y1="134" x2="76" y2="150"/>
    <line x1="96" y1="133" x2="96" y2="149"/>
    <line x1="116" y1="133" x2="116" y2="149"/>
    <line x1="136" y1="134" x2="136" y2="150"/>
    <!-- Fence rails -->
    <line x1="56" y1="140" x2="136" y2="138"/>
    <line x1="56" y1="147" x2="136" y2="145"/>
  </g>

  <!-- Creek hint -->
  <path d="M60,158 Q80,154 100,158 Q120,162 140,158" stroke="#b8912a" stroke-width="1" fill="none" opacity="0.5"/>

  <!-- Brand text -->
  <text x="100" y="174" text-anchor="middle" font-family="Georgia, serif" font-size="9" fill="#d4ae52" letter-spacing="3" font-weight="700">FRONTIER LAND</text>
</svg>
