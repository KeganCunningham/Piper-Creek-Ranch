  <!-- Snow caps hint -->
  <polyline points="74,74 80,62 86,74" stroke="#d4ae52" stroke-width="1" fill="none" stroke-linejoin="round" opacity="0.6"/>
  <polyline points="114,66 120,54 126,66" stroke="#d4ae52" stroke-width="1" fill="none" stroke-linejoin="round" opacity="0.6"/>

  <!-- Top ornament -->
  <circle cx="100" cy="16" r="3" fill="#b8912a"/>
  <!-- Corner ornament marks -->
  <line x1="44" y1="22" x2="50" y2="30" stroke="#b8912a" stroke-width="0.7" opacity="0.5"/>
  <line x1="156" y1="22" x2="150" y2="30" stroke="#b8912a" stroke-width="0.7" opacity="0.5"/>
